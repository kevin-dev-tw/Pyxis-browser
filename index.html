<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>:root{--accent:#E0703A;--accent-hover:#EA7E48;--accent-active:#C96027;--accent-soft:#F8A068;--selection:rgba(224,112,58,.4);--ring:rgba(224,112,58,.22);--accent-shadow:rgba(224,112,58,.3);--accent-shadow-lg:rgba(224,112,58,.45);--glow-strong:rgba(224,112,58,.08);--glow-soft:rgba(224,112,58,.02);--bg:#0c0c0e;--dot:rgba(255,255,255,.05);--ink:#e4e4e7;--ink-strong:#f4f4f5;--mute:#9c9ca6;--mute2:#7c7c86;--glass:rgba(22,22,27,.85);--glass-border:rgba(255,255,255,.08);--glass-border-hover:rgba(255,255,255,.14);--glass-inset:rgba(255,255,255,.06);--surface:#141418;--surface-hover:#1a1a20;--border:#26262c;--card:#16161b;--card-border:#2a2a32;--kbd-bg:#18181d;--kbd-border:#27272e;--danger:#f87171;--danger-bg:#221618;--danger-border:#3f1f24;--danger-solid:#c2410c;--danger-solid-hover:#ea580c;--shadow-sm:0 10px 30px -5px rgba(0,0,0,.5);--shadow-md:0 14px 38px -5px rgba(0,0,0,.6);--shadow-lg:0 16px 40px -5px rgba(0,0,0,.65);--modal-bg:rgba(0,0,0,.65);--title-shadow:0 4px 20px rgba(0,0,0,.5)}
{{THEME_VARS}}
* { box-sizing: border-box; margin: 0; padding: 0; }
::selection {
background: var(--selection);
color: #ffffff;
}
body {
min-height: 100vh;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
background-color: var(--bg);
/* Ambient radial glow + subtle blueprint dot grid */
background-image:
radial-gradient(circle at 50% 48%, var(--glow-strong) 0%, var(--glow-soft) 36%, transparent 68%),
radial-gradient(var(--dot) 1px, transparent 1px);
background-size: 100% 100%, 28px 28px;
color: var(--ink);
font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif;
padding: 24px;
position: relative;
overflow: hidden;
}

/* Ambient corner live clock */
.corner-clock {
position: absolute;
top: 32px;
left: 36px;
font-size: 32px;
font-weight: 250;
letter-spacing: -0.8px;
color: var(--mute);
font-variant-numeric: tabular-nums;
font-feature-settings: "tnum";
line-height: 1;
transition: color 0.18s ease;
}
.corner-clock:hover {
color: var(--ink-strong);
}

/* Center brand identity */
.brand {
display: flex; flex-direction: column; align-items: center;
margin-bottom: 32px;
}
h1 {
font-size: 42px; font-weight: 600; letter-spacing: -0.8px;
color: var(--ink-strong);
text-shadow: var(--title-shadow);
}
h1 span {
color: var(--accent);
position: relative;
}

/* Frosted glass search box */
.search-form {
width: min(620px, 86vw);
display: flex; align-items: center;
background: var(--glass);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--glass-border);
border-radius: 30px;
padding: 6px 8px 6px 24px;
box-shadow:
var(--shadow-sm),
inset 0 1px 0 var(--glass-inset);
transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.search-form:hover {
border-color: var(--glass-border-hover);
box-shadow:
var(--shadow-md),
inset 0 1px 0 var(--glass-inset);
}
.search-form:focus-within {
border-color: var(--accent);
box-shadow:
0 0 0 3px var(--ring),
var(--shadow-lg);
transform: translateY(-1px);
}
.search-input {
flex: 1; border: none; background: transparent; outline: none;
font-size: 15px; color: var(--ink-strong); font-family: inherit;
padding: 10px 0;
}
.search-input::placeholder { color: var(--mute2); }

/* Search button: flat & stable, no scale */
.search-btn {
width: 42px; height: 42px;
border: none; border-radius: 21px;
background: var(--accent); color: #ffffff;
display: flex; align-items: center; justify-content: center;
cursor: pointer; outline: none;
box-shadow: 0 4px 12px var(--accent-shadow);
transition: background-color 0.15s ease, box-shadow 0.15s ease;
flex-shrink: 0; margin-left: 10px;
}
.search-btn:hover {
background: var(--accent-hover);
box-shadow: 0 4px 14px var(--accent-shadow-lg);
}
.search-btn:active {
background: var(--accent-active);
}
.search-btn svg {
width: 18px; height: 18px;
display: block;
}

/* Keyboard hint */
.hint {
margin-top: 26px; font-size: 12.5px; color: var(--mute2);
letter-spacing: 0.3px;
}
.hint kbd {
font-family: inherit; font-size: 11px;
background: var(--kbd-bg); color: var(--mute);
padding: 2px 6px; border-radius: 4px;
border: 1px solid var(--kbd-border);
}
</style>
</head>
<body>
<div class="corner-clock" id="clockTime">--:--</div>

<div class="brand">
<h1><span>P</span>yxis</h1>
</div>

<form class="search-form" id="searchForm" action="https://www.google.com/search" method="get">
<input type="text" class="search-input" id="searchInput" name="q" autofocus
placeholder="Search Google or type a URL" autocomplete="off" spellcheck="false">
<button type="submit" class="search-btn" id="searchBtn" title="Search" aria-label="Search">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<circle cx="11" cy="11" r="7.5"></circle>
<line x1="21" y1="21" x2="16.5" y2="16.5"></line>
</svg>
</button>
</form>

<p class="hint">
<kbd>Ctrl+T</kbd> new tab &middot;
<kbd>Ctrl+\</kbd> split view &middot;
<kbd>Ctrl+L</kbd> address bar &middot;
<kbd>Ctrl+H</kbd> history
</p>

<script>
function updateClock() {
var now = new Date();
var h = String(now.getHours()).padStart(2, '0');
var m = String(now.getMinutes()).padStart(2, '0');
document.getElementById('clockTime').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 1000);

document.getElementById('searchForm').addEventListener('submit', function(e) {
var q = document.getElementById('searchInput').value.trim();
if (!q) { e.preventDefault(); return; }
if (/^https?:\/\//i.test(q)) {
e.preventDefault();
location.href = q;
} else if (!q.includes(' ') && q.includes('.') && !q.startsWith('.')) {
e.preventDefault();
location.href = 'https://' + q;
}
});
</script>
</body>
</html>
